services:
  venture-agent-neo4j:
    image: neo4j:2026.07.1
    container_name: venture-agent-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-venture-agent-graph}"
    volumes:
      - venture_agent_neo4j_data:/data
      - venture_agent_neo4j_logs:/logs

volumes:
  venture_agent_neo4j_data:
  venture_agent_neo4j_logs:
